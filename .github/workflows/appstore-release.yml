name: Upload App Store
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved public main commit SHA
        required: true
        type: string
      build_number:
        description: Reserved shared Apple build number, greater than all existing builds
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: chaiphoto-apple-upload
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'Kongdean2374/ChaiPhoto-Build' && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_FLAVOR: appstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - run: |
          python3 scripts/verify_public_tree.py
          python3 scripts/resolve_version.py --check-only
  upload:
    needs: validate
    runs-on: macos-26
    timeout-minutes: 45
    environment: appstore
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      RELEASE_BUILD_NUMBER: ${{ inputs.build_number }}
      RELEASE_FLAVOR: appstore
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - run: python3 scripts/verify_public_tree.py
      - run: bash scripts/install_toolchain.sh
      - name: Protected production signing and Apple upload
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ vars.APP_STORE_CONNECT_KEY_ID || secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ vars.APP_STORE_CONNECT_ISSUER_ID || secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APPLE_TEAM_ID: ${{ vars.APPLE_TEAM_ID || secrets.APPLE_TEAM_ID }}
          APP_STORE_CONNECT_API_KEY_P8: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          PROVISIONING_PROFILE_BASE64: ${{ secrets.PROVISIONING_PROFILE_BASE64 }}
        run: bash scripts/sign_upload.sh
