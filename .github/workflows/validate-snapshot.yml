name: Validate Reviewed Snapshot
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved public main commit SHA (40 hex characters)
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: chaiphoto-snapshot-validation
  cancel-in-progress: false
jobs:
  validate:
    if: github.repository == 'Kongdean2374/ChaiPhoto-Build' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    timeout-minutes: 45
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
    steps:
      - name: Checkout exact dispatched public source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify reviewed source and offline delivery regressions
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_public_tree.py
          python3 -m unittest discover -s tests -v
      - name: Install verified toolchain
        run: bash scripts/install_toolchain.sh
      - name: Run executable policy regressions for both flavors
        shell: bash
        run: |
          set -euo pipefail
          for flavor in CHAIPHOTO_TESTFLIGHT CHAIPHOTO_APPSTORE; do
            swiftc -swift-version 5 -D "$flavor" ChaiPhoto/AppExperiencePolicy.swift ChaiPhoto/ReviewQueueOrdering.swift Validation/ExperiencePolicyRegression.swift -o "$RUNNER_TEMP/policy-tests"
            "$RUNNER_TEMP/policy-tests"
          done
      - name: Compile both unsigned iPhoneOS flavors
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          python3 scripts/verify_public_tree.py --project
          for config in Release-TestFlight Release-AppStore; do
            xcodebuild -quiet -project ChaiPhoto.xcodeproj -scheme ChaiPhoto \
              -configuration "$config" -sdk iphoneos -destination 'generic/platform=iOS' \
              -derivedDataPath "$RUNNER_TEMP/device-$config" \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
            echo "iPhoneOS $config: PASS" >> "$GITHUB_STEP_SUMMARY"
          done
      - name: Run XCTest and lifecycle UI tests for both flavors
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate --spec project-tests.yml
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["name"].startswith("iOS")))')
          DEVICE_ID=$(xcrun simctl create 'ChaiPhoto Visual Review' com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro "$RUNTIME_ID")
          xcrun simctl boot "$DEVICE_ID"
          xcrun simctl bootstatus "$DEVICE_ID" -b
          python3 scripts/make_visual_fixtures.py "$RUNNER_TEMP/visual-fixtures"
          xcrun simctl addmedia "$DEVICE_ID" "$RUNNER_TEMP"/visual-fixtures/*.png
          status=0
          for config in Release-TestFlight Release-AppStore; do
            if xcodebuild -project ChaiPhoto.xcodeproj -scheme ChaiPhotoValidation \
              -configuration "$config" -destination "platform=iOS Simulator,id=$DEVICE_ID" \
              -derivedDataPath "$RUNNER_TEMP/simulator-$config" \
              -resultBundlePath "$RUNNER_TEMP/test-$config.xcresult" \
              -parallel-testing-enabled NO ENABLE_TESTABILITY=YES \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' test; then
              echo "XCTest + lifecycle UI $config: PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              status=1
              echo "XCTest + lifecycle UI $config: FAIL" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          exit "$status"
      - name: Export actual simulator screenshot attachments
        if: always()
        shell: bash
        env:
          TESTS_SUCCEEDED: ${{ job.status == 'success' }}
        run: |
          set -euo pipefail
          status=0
          for config in Release-TestFlight Release-AppStore; do
            bundle="$RUNNER_TEMP/test-$config.xcresult"
            if test -d "$bundle"; then
              args=()
              if test "$TESTS_SUCCEEDED" = true; then args+=(--require-complete); fi
              if ! python3 scripts/collect_visual_review.py "$bundle" "$RUNNER_TEMP/visual-review/$config" "${args[@]}"; then status=1; fi
            elif test "$TESTS_SUCCEEDED" = true; then
              status=1
            fi
          done
          exit "$status"
      - name: Retain synthetic simulator screenshots only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-review-${{ github.sha }}
          path: |
            ${{ runner.temp }}/visual-review/Release-TestFlight/*.png
            ${{ runner.temp }}/visual-review/Release-TestFlight/*.jpg
            ${{ runner.temp }}/visual-review/Release-AppStore/*.png
            ${{ runner.temp }}/visual-review/Release-AppStore/*.jpg
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
