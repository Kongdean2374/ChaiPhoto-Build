name: Validate Reviewed Snapshot
run-name: Validate ${{ inputs.validation_scope }} ${{ inputs.expected_sha }}
on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact approved public main commit SHA (40 hex characters)
        required: true
        type: string
      validation_scope:
        description: layout_batch for independent missing nine-page profiles; other scopes remain available
        required: true
        default: quick
        type: choice
        options: [quick, layout, layout_batch, focused, full]
      layout_profile:
        description: Used only by layout scope; real narrow-screen language/theme/text-size profile
        required: true
        default: fr-dark-extra
        type: choice
        options: [zh-Hant-light-standard, zh-Hant-dark-extra, zh-Hans-light-standard, zh-Hans-dark-extra, en-light-standard, en-dark-extra, ja-light-standard, ja-dark-extra, es-light-standard, es-dark-extra, fr-light-standard, fr-dark-extra]
      layout_profiles:
        description: 'layout_batch only: JSON array of missing profiles; never include already accepted profiles'
        required: false
        default: '[]'
        type: string
      layout_flavor:
        description: layout_batch only; select the missing flavor or both
        required: true
        default: both
        type: choice
        options: [both, Release-TestFlight, Release-AppStore]
permissions:
  contents: read
concurrency:
  group: chaiphoto-snapshot-validation
  cancel-in-progress: false
jobs:
  plan:
    name: Plan only requested validation gaps
    if: github.repository == 'Kongdean2374/ChaiPhoto-Build' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - name: Validate and expand requested layout segments
        id: plan
        shell: bash
        env:
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          VALIDATION_SCOPE: ${{ inputs.validation_scope }}
          REQUESTED_PROFILES: ${{ inputs.layout_profiles }}
          REQUESTED_FLAVOR: ${{ inputs.layout_flavor }}
        run: |
          set -euo pipefail
          python3 - <<'PYTHON'
          import json, os, re
          scope = os.environ['VALIDATION_SCOPE']
          sha = os.environ['EXPECTED_SHA']
          if not re.fullmatch(r'[0-9a-f]{40}', sha) or sha != os.environ['GITHUB_SHA']:
              raise SystemExit('Expected SHA must equal this exact dispatched main commit')
          flavors = ['Release-TestFlight', 'Release-AppStore']
          profiles = ['selected']
          if scope == 'layout_batch':
              profiles = json.loads(os.environ['REQUESTED_PROFILES'])
              allowed = {f'{language}-{appearance}-{size}'
                         for language in ('zh-Hant', 'zh-Hans', 'en', 'ja', 'es', 'fr')
                         for appearance, size in (('light', 'standard'), ('dark', 'extra'))}
              if (not isinstance(profiles, list) or not profiles or len(profiles) > 12
                  or any(not isinstance(p, str) or p not in allowed for p in profiles)
                  or len(set(profiles)) != len(profiles)):
                  raise SystemExit('Select 1-12 unique supported missing layout profiles')
              flavor = os.environ['REQUESTED_FLAVOR']
              if flavor not in ['both'] + flavors:
                  raise SystemExit('Unsupported layout flavor')
              if flavor != 'both': flavors = [flavor]
          elif scope not in ('quick', 'layout', 'focused', 'full'):
              raise SystemExit('Unsupported validation scope')
          entries = [{'flavor': f, 'profile': p} for p in profiles for f in flavors]
          for index, entry in enumerate(entries):
              entry['regressions'] = scope != 'layout_batch' or index == 0
          matrix = {'include': entries}
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('matrix=' + json.dumps(matrix, separators=(',', ':')) + '\n')
          PYTHON
  validate:
    needs: plan
    name: Validate ${{ matrix.flavor }} / ${{ matrix.profile }}
    if: github.repository == 'Kongdean2374/ChaiPhoto-Build' && github.event.repository.private == false && github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: macos-26
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    timeout-minutes: ${{ inputs.validation_scope == 'full' && 120 || inputs.validation_scope == 'focused' && 65 || inputs.validation_scope == 'layout_batch' && 40 || 25 }}
    env:
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      VALIDATION_FLAVOR: ${{ matrix.flavor }}
      VALIDATION_SCOPE: ${{ inputs.validation_scope == 'layout_batch' && 'layout' || inputs.validation_scope }}
      LAYOUT_PROFILE: ${{ inputs.validation_scope == 'layout_batch' && matrix.profile || inputs.layout_profile }}
      LAYOUT_SEGMENT: ${{ inputs.validation_scope == 'layout_batch' && 'true' || 'false' }}
      RUN_REGRESSIONS: ${{ matrix.regressions && 'true' || 'false' }}
    steps:
      - name: Checkout exact dispatched public source
        timeout-minutes: 2
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1
      - name: Verify reviewed source and offline delivery regressions
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/verify_public_tree.py
          if test "${LAYOUT_SEGMENT:-false}" != true || test "$RUN_REGRESSIONS" = true; then
            python3 -m unittest discover -s tests -v
          else
            echo 'Unchanged offline regressions run once in the first batch segment; source/SHA verification remains per segment'
          fi
      - name: Install verified toolchain
        timeout-minutes: 3
        run: bash scripts/install_toolchain.sh
      - name: Run executable policy regressions for both flavors
        if: inputs.validation_scope != 'layout_batch' || matrix.regressions
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          for flavor in CHAIPHOTO_TESTFLIGHT CHAIPHOTO_APPSTORE; do
            swiftc -swift-version 5 -D "$flavor" ChaiPhoto/AppExperiencePolicy.swift ChaiPhoto/ReviewQueueOrdering.swift Validation/ExperiencePolicyRegression.swift -o "$RUNNER_TEMP/policy-tests"
            "$RUNNER_TEMP/policy-tests"
          done
          swiftc -swift-version 5 ChaiPhoto/AppLocalization.swift ChaiPhoto/ReviewQueueOrdering.swift Validation/LanguagePolicyRegression.swift -o "$RUNNER_TEMP/language-policy-tests"
          "$RUNNER_TEMP/language-policy-tests"
          for localization in ChaiPhoto/Localization/*.lproj; do
            plutil -lint "$localization/Localizable.strings" "$localization/Localizable.stringsdict" "$localization/InfoPlist.strings"
          done
      - name: Compile assigned unsigned iPhoneOS flavor
        if: inputs.validation_scope == 'full' || inputs.validation_scope == 'focused'
        shell: bash
        run: |
          set -euo pipefail
          xcodegen generate
          python3 scripts/verify_public_tree.py --project
          config="$VALIDATION_FLAVOR"
          xcodebuild -quiet -project ChaiPhoto.xcodeproj -scheme ChaiPhoto \
            -configuration "$config" -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath "$RUNNER_TEMP/device-$config" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          echo "iPhoneOS $config: PASS" >> "$GITHUB_STEP_SUMMARY"
      - name: Run targeted navigation then requested acceptance suite
        id: acceptance
        # Stop this segment well before the job limit, leaving time for export/upload.
        timeout-minutes: ${{ inputs.validation_scope == 'layout_batch' && 18 || inputs.validation_scope == 'full' && 110 || inputs.validation_scope == 'focused' && 55 || 20 }}
        shell: bash
        run: |
          set -euo pipefail
          case "$VALIDATION_SCOPE" in quick|layout|focused|full) ;; *) echo 'Unsupported validation scope'; exit 1 ;; esac
          xcodegen generate --spec project-tests.yml
          RUNTIME_ID=$(xcrun simctl list runtimes -j | python3 -c 'import json,sys; print(next(r["identifier"] for r in json.load(sys.stdin)["runtimes"] if r["isAvailable"] and r["name"].startswith("iOS")))')
          python3 scripts/make_visual_fixtures.py "$RUNNER_TEMP/visual-fixtures"
          swift scripts/make_visual_video.swift "$RUNNER_TEMP/visual-fixtures/visual-video.mov"
          DEVICE_TYPE=$(xcrun simctl list devicetypes -j | python3 -c 'import json,sys; print(next(d["identifier"] for d in json.load(sys.stdin)["devicetypes"] if d["name"] == "iPhone SE (3rd generation)"))')
          config="$VALIDATION_FLAVOR"
          DEVICE_ID=''
          segment_succeeded=false
          cleanup() {
            if test -n "$DEVICE_ID"; then
              if test "${LAYOUT_SEGMENT:-false}" = true && test "$segment_succeeded" != true; then
                mkdir -p "$RUNNER_TEMP/visual-review/$config"
                # Fallback if an interrupted xcresult cannot export its attachments.
                # This device contains only generated CI media, never user photos.
                xcrun simctl io "$DEVICE_ID" screenshot "$RUNNER_TEMP/visual-review/$config/visual-l128-segment-interrupted-$LAYOUT_PROFILE.png" || true
              fi
              xcrun simctl shutdown "$DEVICE_ID" >/dev/null 2>&1 || true
            fi
          }
          trap cleanup EXIT
          boot_fixture() {
            DEVICE_ID=$(xcrun simctl create "ChaiPhoto $config $1" "$DEVICE_TYPE" "$RUNTIME_ID")
            printf '%s\n' "$DEVICE_ID" > "$RUNNER_TEMP/visual-device-id"
            xcrun simctl boot "$DEVICE_ID"
            xcrun simctl bootstatus "$DEVICE_ID" -b
            xcrun simctl addmedia "$DEVICE_ID" "$RUNNER_TEMP"/visual-fixtures/*.png "$RUNNER_TEMP"/visual-fixtures/*.mov
          }
          layout_methods=(testLayout00zhHantLight testLayout00zhHantDarkLarge testLayout01zhHansLight testLayout01zhHansDarkLarge testLayout02enLight testLayout02enDarkLarge testLayout03jaLight testLayout03jaDarkLarge testLayout04esLight testLayout04esDarkLarge testLayout05frLight testLayout05frDarkLarge)
          layout_profiles=(zh-Hant-light-standard zh-Hant-dark-extra zh-Hans-light-standard zh-Hans-dark-extra en-light-standard en-dark-extra ja-light-standard ja-dark-extra es-light-standard es-dark-extra fr-light-standard fr-dark-extra)
          if test "$VALIDATION_SCOPE" != layout; then
            boot_fixture quick
            if xcodebuild -project ChaiPhoto.xcodeproj -scheme ChaiPhotoValidation \
              -configuration "$config" -destination "platform=iOS Simulator,id=$DEVICE_ID" \
              -derivedDataPath "$RUNNER_TEMP/simulator-$config" \
              -resultBundlePath "$RUNNER_TEMP/quick-$config.xcresult" \
              -only-testing:ChaiPhotoUITests/LocalizationFlowTests/testNavigationQuick \
              -only-testing:ChaiPhotoUITests/LocalizationFlowTests/testManualLanguageChangePreservesPendingItemsAndCurrentPhoto \
              -only-testing:ChaiPhotoUITests/LocalizationFlowTests/testDiagnosticsPresentationQuick \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 480 \
              -maximum-test-execution-time-allowance 480 -parallel-testing-enabled NO ENABLE_TESTABILITY=YES \
              CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' test; then
              echo "Navigation + relaunch dismissal + diagnostics $config: PASS" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "Targeted probes $config: FAIL; acceptance suite not started" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            cleanup
            DEVICE_ID=''
          fi
          if test "$VALIDATION_SCOPE" = quick; then
            echo "Visual acceptance: NOT RUN (quick scope)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          # Fresh media/permission/guide state for lifecycle tests. Compiled test
          # products may be reused, but the probes' saved choices may not.
          boot_fixture full
          test_action=test-without-building
          suite_args=(-skip-testing:ChaiPhotoUITests/LocalizationFlowTests/testNavigationQuick -skip-testing:ChaiPhotoUITests/LocalizationFlowTests/testDiagnosticsPresentationQuick)
          if test "$VALIDATION_SCOPE" = layout; then
            selected=''
            for index in "${!layout_profiles[@]}"; do
              if test "${layout_profiles[$index]}" = "$LAYOUT_PROFILE"; then selected="${layout_methods[$index]}"; fi
            done
            if test -z "$selected"; then echo 'Unsupported layout profile'; exit 1; fi
            test_action=test
            suite_args=("-only-testing:ChaiPhotoUITests/LocalizationFlowTests/$selected")
            # Existing one-profile scope retains its unit regressions. Batch jobs
            # cover UI gaps only; unchanged unit/manual/navigation evidence is reused.
            if test "${LAYOUT_SEGMENT:-false}" != true; then suite_args+=(-only-testing:ChaiPhotoTests); fi
          elif test "$VALIDATION_SCOPE" = focused; then
            suite_args=(-only-testing:ChaiPhotoTests -only-testing:ChaiPhotoUITests/LaunchFlowTests -only-testing:ChaiPhotoUITests/LocalizationFlowTests/testMatrix05frDarkLarge)
            for method in "${layout_methods[@]}"; do suite_args+=("-only-testing:ChaiPhotoUITests/LocalizationFlowTests/$method"); done
          else
            # These new short profiles duplicate the same views in the unchanged
            # full matrix. All original 43 full tests remain selected.
            for method in "${layout_methods[@]}"; do suite_args+=("-skip-testing:ChaiPhotoUITests/LocalizationFlowTests/$method"); done
          fi
          if xcodebuild -project ChaiPhoto.xcodeproj -scheme ChaiPhotoValidation \
            -configuration "$config" -destination "platform=iOS Simulator,id=$DEVICE_ID" \
            -derivedDataPath "$RUNNER_TEMP/simulator-$config" \
            -resultBundlePath "$RUNNER_TEMP/test-$config.xcresult" \
            "${suite_args[@]}" \
            -test-timeouts-enabled YES -default-test-execution-time-allowance 900 \
            -maximum-test-execution-time-allowance 900 -parallel-testing-enabled NO ENABLE_TESTABILITY=YES \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' "$test_action"; then
            segment_succeeded=true
            echo "$VALIDATION_SCOPE acceptance $config / $LAYOUT_PROFILE: PASS" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "$VALIDATION_SCOPE acceptance $config: FAIL" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Export actual simulator screenshot attachments
        timeout-minutes: 4
        if: always()
        shell: bash
        env:
          TESTS_SUCCEEDED: ${{ job.status == 'success' }}
        run: |
          set -euo pipefail
          status=0
          if test "${LAYOUT_SEGMENT:-false}" = true && test "$TESTS_SUCCEEDED" != true; then
            frame="$RUNNER_TEMP/visual-review/$VALIDATION_FLAVOR/visual-l128-segment-interrupted-$LAYOUT_PROFILE.png"
            if test ! -f "$frame" && test -f "$RUNNER_TEMP/visual-device-id"; then
              mkdir -p "$(dirname "$frame")"
              device=$(cat "$RUNNER_TEMP/visual-device-id")
              # Independent fallback when a step timeout prevented its EXIT trap.
              xcrun simctl io "$device" screenshot "$frame" || echo 'Interrupted simulator frame unavailable; attempting xcresult export next'
            fi
          fi
          for config in "$VALIDATION_FLAVOR"; do
            quick_bundle="$RUNNER_TEMP/quick-$config.xcresult"
            if test -d "$quick_bundle"; then
              if test "$TESTS_SUCCEEDED" = true; then
                if ! python3 scripts/collect_visual_review.py "$quick_bundle" "$RUNNER_TEMP/visual-review/$config/quick" --require-quick; then status=1; fi
              elif ! python3 scripts/collect_visual_review.py "$quick_bundle" "$RUNNER_TEMP/visual-review/$config/quick"; then
                status=1
              fi
            elif test "$TESTS_SUCCEEDED" = true && test "$VALIDATION_SCOPE" != layout; then
              status=1
            fi
            bundle="$RUNNER_TEMP/test-$config.xcresult"
            if test -d "$bundle"; then
              if test "$TESTS_SUCCEEDED" = true; then
                case "$VALIDATION_SCOPE" in
                  full) if ! python3 scripts/collect_visual_review.py "$bundle" "$RUNNER_TEMP/visual-review/$config" --require-complete; then status=1; fi ;;
                  focused) if ! python3 scripts/collect_visual_review.py "$bundle" "$RUNNER_TEMP/visual-review/$config" --require-focused; then status=1; fi ;;
                  layout) if ! python3 scripts/collect_visual_review.py "$bundle" "$RUNNER_TEMP/visual-review/$config" --require-layout "--layout-profile=$LAYOUT_PROFILE"; then status=1; fi ;;
                  *) echo 'Unexpected acceptance bundle for this scope'; status=1 ;;
                esac
              elif ! python3 scripts/collect_visual_review.py "$bundle" "$RUNNER_TEMP/visual-review/$config"; then
                status=1
              fi
            elif test "$TESTS_SUCCEEDED" = true && test "$VALIDATION_SCOPE" != quick; then
              status=1
            fi
          done
          exit "$status"
      - name: Retain synthetic simulator screenshots only
        timeout-minutes: 3
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: visual-review-${{ github.sha }}-${{ matrix.flavor }}-${{ matrix.profile }}
          path: |
            ${{ runner.temp }}/visual-review/Release-TestFlight/*.png
            ${{ runner.temp }}/visual-review/Release-TestFlight/*.jpg
            ${{ runner.temp }}/visual-review/Release-AppStore/*.png
            ${{ runner.temp }}/visual-review/Release-AppStore/*.jpg
            ${{ runner.temp }}/visual-review/Release-TestFlight/quick/*.png
            ${{ runner.temp }}/visual-review/Release-TestFlight/quick/*.jpg
            ${{ runner.temp }}/visual-review/Release-AppStore/quick/*.png
            ${{ runner.temp }}/visual-review/Release-AppStore/quick/*.jpg
          if-no-files-found: warn
          retention-days: 3
          compression-level: 0
